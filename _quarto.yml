project:
  type: website
  output-dir: docs
  resources: 
    - images/
    - CNAME

website:
  title: "Dan Yavorsky"
  description: "Quantitative Marketing Research Scientist"
  
  site-url: "https://www.danyavorsky.com"
  favicon: /images/favicon.ico
  search: false
  
  navbar:
    search: false
    left:
      - href: index.qmd
        icon: person-circle
        text: "About"
      # No landing page at /cv/ on purpose -- the dropdown goes straight to a
      # document. Old /cv/ links are kept alive by an `aliases:` redirect
      # declared in cv/resume/index.qmd, which is why nothing here points at
      # cv/index.qmd (that file is gone).
      - text: "Resume/CV"
        icon: file-earmark-check
        menu:
          - text: "Resume"
            icon: file-earmark-person
            href: cv/resume/index.qmd
          - text: "Vita"
            icon: file-earmark-text
            href: cv/vita/index.qmd
      - href: teaching/index.qmd
        icon: mortarboard
        text: "Teaching"
      - href: pubs/index.qmd
        icon: journals
        text: "Pubs"
      - href: posts/index.qmd
        icon: pencil-square
        text: "Posts"
      #- href: http://dcme-r.danyavorsky.com
      #  icon: book
      #  text: "DCME-R"
      #  target: _blank
      - text: "Links"
        icon: link-45deg
        menu: 
          - text: "R Programming"
            icon: bi-r-circle # file-earmark-code
            href: links/r.qmd
          - text: "Python"
            icon: filetype-py
            href: links/python.qmd
          - text: "Computing"
            icon: terminal
            href: links/compute.qmd
          - text: "Stats"
            icon: bar-chart
            href: links/stats.qmd
          - text: "Demand Estimation"
            icon: graph-up
            href: links/demand-estimation.qmd
          - text: "Consumer Search"
            icon: signpost-split
            href: links/consumer-search.qmd
          - text: "Advice"
            icon: info-square
            href: links/advice.qmd
          - text: "Blogs"
            icon: file-text
            href: links/blogs.qmd
          - text: "Quotes"
            icon: chat-quote
            href: links/quotes.qmd
    tools:
      - icon: github
        href: https://github.com/dyavorsky/quarto_website
  
  repo-branch: main
  repo-url: "https://github.com/dyavorsky/quarto_website"
  
format:
  html:
    theme: [solar, custom.scss]
    css: custom.scss
    toc: true

execute:
  freeze: auto
  cache: true

