name: Render and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Callable so sync-resume.yml can deploy the commit it just made. A push made
  # with the built-in GITHUB_TOKEN does NOT trigger workflows (GitHub's loop
  # prevention), so that workflow cannot rely on the `push` trigger above and
  # calls this one directly instead.
  workflow_call:
    inputs:
      ref:
        description: "Commit or branch to render. Defaults to the triggering commit."
        type: string
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it, so a rapid
# second push can't leave the site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # `inputs.ref` is null for push/workflow_dispatch, so this falls back to
      # the triggering commit -- i.e. unchanged behaviour. It matters only when
      # sync-resume.yml calls this workflow: a local `uses:` call runs at the
      # CALLER's commit, which predates the sync commit, so without an explicit
      # ref the site would render the previous resume.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          # Pinned to match Dan's local install. Bump deliberately, and
          # re-render locally when you do, so CI and local agree.
          version: 1.10.18

      # No R / Python setup on purpose. Every executable document is frozen
      # (`_freeze/` is committed; posts/_metadata.yml sets freeze: true), so a
      # clean render needs no language runtime. If this step ever fails with a
      # missing R, it means a document started executing code again -- either
      # re-freeze it locally and commit _freeze/, or add r-lib/actions/setup-r
      # plus the packages that document needs.
      - name: Render site
        run: quarto render

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
